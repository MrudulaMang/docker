#session 53
# depends_on affects container startup order, not image building.
services:
  catalogue:
    image: mrudula158/catalogue:1.3.0 # image name
    build: ./b1-catalogue                #pulls dockerfile from mentioned local folder
    container_name: catalogue
    depends_on:
      - mongodb
  mongodb:
    build: ./d1-mongodb
    image: mrudula158/mongodb:1.3.0
    container_name: mongodb
    volumes:
    - mongodb:/data/db 
  redis:
    image: redis:7.0                  #directly pulling from docker hub- official image, as we are not customising redis
    container_name: redis
    volumes:  
    - redis:/data 
  mysql:
    build: ./d2-mysql
    image: mrudula158/mysql:1.3.0
    container_name: mysql
    volumes:
    - mysql:/var/lib/mysql
  rabbitmq:
    image: rabbitmq:3                #directly pulling from docker hub- official image
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
    container_name: rabbitmq
    volumes:
    - rabbitmq:/var/lib/rabbitmq
  user:
    build: ./b2-user
        # dockerfile: user.dockerfile --- not working like this. not able to read dockerfile
    image: mrudula158/user:1.3.0
    container_name: user
    depends_on:
      - redis
      - mongodb
  cart:
    build: ./b3-cart
    image: mrudula158/cart:1.3.0
    container_name: cart
    depends_on:
     - redis
     - catalogue
  shipping:
    build: ./b4-shipping
    image: mrudula158/shipping:1.3.0
    container_name: shipping
    environment:
      CART_ENDPOINT: "cart:8080"
      DB_HOST: "mysql"
    depends_on:
     - mysql
     - cart
  payment:
    build: ./b5-payment
    image: mrudula158/payment:1.3.0
    container_name: payment
    environment:
      CART_HOST: "cart"
      CART_PORT: "8080"
      USER_HOST: "user"
      USER_PORT: "8080"
      AMQP_HOST: "rabbitmq"
      AMQP_USER: "roboshop"
      AMQP_PASS: "roboshop123"
    depends_on:
     - rabbitmq
     - cart
     - user
  frontend:
    build: ./b6-frontend
    image: mrudula158/frontend:1.3.0
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - catalogue
      - user
      - cart
      - shipping
      - payment
volumes:
  mongodb:
  redis:
  mysql:
  rabbitmq:    
networks:
  default:
    driver: bridge
    name: roboshop
    external: false 

  #if true u have to create the network outisde the docr compose file

